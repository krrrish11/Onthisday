<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On This Day — Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF8F4;
    --ink: #1B1B1B;
    --ink-soft: #6B6558;
    --rust: #B5502D;
    --line: #DDD8CC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 90px;
  }
  .sans{ font-family: 'Inter', sans-serif; }

  .masthead{
    width: 100%;
    max-width: 620px;
    text-align: center;
    margin-bottom: 8px;
  }
  .masthead p.eyebrow{
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .masthead h1{
    font-size: clamp(30px, 6vw, 44px);
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  /* ---- Date navigator ---- */
  .nav-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 28px 0 6px;
    font-family: 'Inter', sans-serif;
  }
  .nav-row select{
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--ink);
    font-family: 'Source Serif 4', serif;
    font-size: 17px;
    color: var(--ink);
    padding: 4px 4px 6px;
    cursor: pointer;
    text-align: center;
  }
  .nav-row select:focus-visible{ outline: 2px solid var(--rust); outline-offset: 3px; }
  .nav-row button{
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--rust);
    cursor: pointer;
    padding: 4px 8px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .cats{
    display: flex;
    justify-content: center;
    gap: 22px;
    margin: 22px 0 4px;
    font-family: 'Inter', sans-serif;
    border-bottom: 1px solid var(--line);
    width: 100%;
    max-width: 620px;
    padding-bottom: 0;
  }
  .cats button{
    background: none;
    border: none;
    font-size: 13.5px;
    color: var(--ink-soft);
    padding: 10px 2px 12px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .cats button.active{ color: var(--ink); border-bottom-color: var(--rust); }

  .status{
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 18px 0 6px;
  }

  /* ---- Vertical timeline ---- */
  .timeline{
    width: 100%;
    max-width: 620px;
    position: relative;
    padding-left: 26px;
    margin-top: 10px;
  }
  .timeline::before{
    content: '';
    position: absolute;
    left: 4px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--line);
  }
  .node{
    position: relative;
    padding-bottom: 34px;
  }
  .node::before{
    content: '';
    position: absolute;
    left: -26px;
    top: 6px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--rust);
    border: 2px solid var(--paper);
    box-shadow: 0 0 0 1px var(--rust);
  }
  .node .yr{
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .node .txt{
    font-size: 16px;
    line-height: 1.6;
    margin: 0 0 8px;
    max-width: 60ch;
  }
  .node .refs{ font-family: 'Inter', sans-serif; }
  .node .refs a{
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    margin-right: 14px;
  }
  .node .refs a:hover{ color: var(--rust); border-color: var(--rust); }
  .node img{
    width: 100%; max-width: 280px;
    border-radius: 2px;
    margin: 10px 0 4px;
    display: block;
  }

  .state-msg{
    font-family: 'Inter', sans-serif;
    color: var(--ink-soft);
    text-align: center;
    padding: 50px 0;
    font-size: 14px;
  }

  footer{
    max-width: 620px; width: 100%;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 30px;
    opacity: 0.8;
  }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
</style>
</head>
<body>

<div class="masthead">
  <p class="eyebrow sans">A record of what happened</p>
  <h1 id="dateHeading">On This Day</h1>
</div>

<div class="nav-row">
  <select id="monthSelect" aria-label="Month"></select>
  <select id="daySelect" aria-label="Day"></select>
  <button id="todayBtn" type="button">Jump to today</button>
</div>

<nav class="cats" id="tabs">
  <button data-type="events" class="active">Events</button>
  <button data-type="births">Births</button>
  <button data-type="deaths">Deaths</button>
  <button data-type="holidays">Holidays</button>
</nav>

<p class="status" id="statusLine">&nbsp;</p>

<div class="timeline" id="results">
  <div class="state-msg">Pick a date to see its history.</div>
</div>

<footer>Data from Wikipedia's On This Day API</footer>

<script>
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const monthSelect = document.getElementById('monthSelect');
  const daySelect = document.getElementById('daySelect');
  const dateHeading = document.getElementById('dateHeading');
  const statusLine = document.getElementById('statusLine');
  const results = document.getElementById('results');
  const tabs = document.getElementById('tabs');
  let currentType = 'events';
  let cache = {};

  function daysInMonth(m){ return new Date(2024, m, 0).getDate(); }

  function populateMonths(){
    MONTHS.forEach((name,i)=>{
      const opt = document.createElement('option');
      opt.value = i+1; opt.textContent = name;
      monthSelect.appendChild(opt);
    });
  }
  function populateDays(month){
    const count = daysInMonth(month);
    const prev = parseInt(daySelect.value) || 1;
    daySelect.innerHTML = '';
    for(let d=1; d<=count; d++){
      const opt = document.createElement('option');
      opt.value = d; opt.textContent = String(d).padStart(2,'0');
      daySelect.appendChild(opt);
    }
    daySelect.value = Math.min(prev, count);
  }
  function setToday(){
    const now = new Date();
    monthSelect.value = now.getMonth()+1;
    populateDays(now.getMonth()+1);
    daySelect.value = now.getDate();
  }

  async function fetchDay(month, day){
    const key = `${month}-${day}`;
    if(cache[key]) return cache[key];
    const mm = String(month).padStart(2,'0'), dd = String(day).padStart(2,'0');
    const res = await fetch(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/all/${mm}/${dd}`);
    if(!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    cache[key] = data;
    return data;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderEntries(list, type){
    if(!list || list.length===0){
      results.innerHTML = `<div class="state-msg">No ${type} found for this date.</div>`;
      return;
    }
    const sorted = [...list].sort((a,b)=>(a.year??0)-(b.year??0));
    results.innerHTML = sorted.map(item=>{
      const year = item.year !== undefined ? item.year : '';
      const page = item.pages && item.pages[0];
      const thumb = page && page.thumbnail ? page.thumbnail.source : null;
      const refs = (item.pages||[]).slice(0,4).map(p=>{
        const title = p.normalizedtitle || p.title || '';
        const link = p.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${encodeURIComponent(p.title||'')}`;
        return `<a href="${link}" target="_blank" rel="noopener">${escapeHtml(title)}</a>`;
      }).join('');
      return `
        <div class="node">
          <p class="yr">${year}</p>
          <p class="txt">${escapeHtml(item.text||'')}</p>
          ${thumb ? `<img src="${thumb}" alt="" loading="lazy">` : ''}
          <div class="refs">${refs}</div>
        </div>`;
    }).join('');
  }

  async function loadAndRender(){
    const month = parseInt(monthSelect.value);
    const day = parseInt(daySelect.value);
    dateHeading.textContent = `${MONTHS[month-1]} ${day}`;
    statusLine.textContent = 'Fetching…';
    results.innerHTML = `<div class="state-msg">Loading…</div>`;
    try{
      const data = await fetchDay(month, day);
      const list = data[currentType] || [];
      statusLine.textContent = `${list.length} ${currentType} on record`;
      renderEntries(list, currentType);
    }catch(e){
      statusLine.textContent = 'Failed to load';
      results.innerHTML = `<div class="state-msg">Couldn't reach Wikipedia. Try again.</div>`;
      console.error(e);
    }
  }

  monthSelect.addEventListener('change', ()=>{ populateDays(parseInt(monthSelect.value)); loadAndRender(); });
  daySelect.addEventListener('change', loadAndRender);
  document.getElementById('todayBtn').addEventListener('click', ()=>{ setToday(); loadAndRender(); });
  tabs.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-type]');
    if(!btn) return;
    currentType = btn.dataset.type;
    [...tabs.children].forEach(b=>b.classList.toggle('active', b===btn));
    loadAndRender();
  });

  populateMonths();
  setToday();
  loadAndRender();
</script>
</body>
</html>
